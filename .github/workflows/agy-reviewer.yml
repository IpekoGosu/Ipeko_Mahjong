name: AGY Code Review

on:
    pull_request:
        types: [opened, synchronize, reopened]
    issue_comment:
        types: [created]
    pull_request_review_comment:
        types: [created]

jobs:
    review:
        if: >-
            (github.event_name == 'pull_request' ||
             (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
             github.event_name == 'pull_request_review_comment') &&
            github.actor != 'agy-reviewer-ksw[bot]' &&
            github.event.sender.login != 'agy-reviewer-ksw[bot]'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            issues: write

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Generate GitHub App Token
              id: app-token
              if: env.HAS_APP_CREDS == 'true'
              uses: actions/create-github-app-token@v1
              with:
                  app-id: ${{ secrets.AGY_APP_ID }}
                  private-key: ${{ secrets.AGY_PRIVATE_KEY }}
              env:
                  HAS_APP_CREDS: ${{ secrets.AGY_APP_ID != '' && secrets.AGY_PRIVATE_KEY != '' }}

            - name: Run AGY Code Reviewer
              uses: IpekoGosu/agy-reviewer-action@v1
              with:
                  gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
                  github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
                  thinking-level: 'HIGH'
                  bot-name: 'agy-reviewer-ksw'
                  bot-mention: '@agy-reviewer-ksw, @AGY'
