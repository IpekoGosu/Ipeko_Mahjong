services:
  mysql:
    image: mysql:8.0
    container_name: ipeko-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ipekomahjong
      MYSQL_USER: myuser
      MYSQL_PASSWORD: 1234
    ports:
      - '3306:3306'
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'myuser', '-p1234']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
